name: AppImage

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-appimage:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            libgl1-mesa-dev \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libfuse2 \
            file \
            libicu-dev \
            libssl-dev \
            libharfbuzz-dev \
            libfreetype6-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'linux'
          target: 'desktop'
          arch: 'gcc_64'
          modules: 'qtpositioning qtlocation'
          cache: true

      - name: Setup vcpkg (without Python compilation)
        run: |
          git clone https://github.com/Microsoft/vcpkg.git ${{ runner.temp }}/vcpkg
          cd ${{ runner.temp }}/vcpkg
          ./bootstrap-vcpkg.sh
          echo "VCPKG_ROOT=${{ runner.temp }}/vcpkg" >> $GITHUB_ENV

      - name: Checkout MapLibre Native Qt
        uses: actions/checkout@v4
        with:
          repository: maplibre/maplibre-native-qt
          path: maplibre-native-qt
          submodules: recursive
          fetch-depth: 0

      - name: Verify submodules
        run: |
          cd maplibre-native-qt
          git submodule update --init --recursive
          ls -la vendor/maplibre-native/

      - name: Build MapLibre Native Qt
        run: |
          cd maplibre-native-qt
          mkdir -p build
          cd build
          
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/maplibre-install \
            -DCMAKE_PREFIX_PATH="${Qt6_DIR}" \
            -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
            -DMLN_WITH_OPENGL=ON \
            -DMLN_QT_WITH_WIDGETS=OFF \
            -G Ninja
          
          ninja -j$(nproc)
          ninja install

      - name: Configure project
        run: |
          mkdir -p build
          cd build
          
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
            -DCMAKE_PREFIX_PATH="${Qt6_DIR};${{ github.workspace }}/maplibre-install" \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install \
            -DBUILD_TESTS=OFF \
            -DBENCHMARK_ENABLE=OFF \
            -DBUILD_DOCS=OFF \
            -G Ninja

      - name: Build project
        run: |
          cd build
          ninja -j$(nproc)

      - name: Download linuxdeploy
        run: |
          cd ${{ github.workspace }}
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage

      - name: Create AppImage
        env:
          QMAKE: ${{ env.Qt6_DIR }}/bin/qmake
          QML_SOURCES_PATHS: ${{ github.workspace }}/ui
          QML_MODULES_PATHS: ${{ env.Qt6_DIR }}/qml
          EXTRA_QT_PLUGINS: positioning;location;geoservices
          NO_STRIP: 1
        run: |
          cd ${{ github.workspace }}
          
          # Prepare AppDir
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          # Find the built executable
          if [ -f build/src/qHexWalker ]; then
            cp build/src/qHexWalker AppDir/usr/bin/
          elif [ -f build/qHexWalker ]; then
            cp build/qHexWalker AppDir/usr/bin/
          else
            echo "ERROR: qHexWalker executable not found"
            find build -name "qHexWalker" -type f
            exit 1
          fi

          cp packaging/appimage/qHexWalker.desktop AppDir/usr/share/applications/

          # Create icon
          cat > AppDir/usr/share/icons/hicolor/256x256/apps/qHexWalker.svg << 'ICONEOF'
          <svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
            <rect width="256" height="256" rx="32" fill="#4CAF50"/>
            <polygon points="128,48 197,88 197,168 128,208 59,168 59,88" fill="none" stroke="white" stroke-width="8"/>
          </svg>
          ICONEOF

          # Create AppRun wrapper if needed
          cat > AppDir/AppRun << 'APPRUNEOF'
          #!/bin/bash
          APPDIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export LD_LIBRARY_PATH="${APPDIR}/usr/lib:${LD_LIBRARY_PATH}"
          export QML_IMPORT_PATH="${APPDIR}/usr/qml:${QML_IMPORT_PATH}"
          exec "${APPDIR}/usr/bin/qHexWalker" "$@"
          APPRUNEOF
          chmod +x AppDir/AppRun

          # Run linuxdeploy
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable AppDir/usr/bin/qHexWalker \
            --desktop-file AppDir/usr/share/applications/qHexWalker.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/qHexWalker.svg \
            --plugin qt \
            --output appimage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: qHexWalker-AppImage
          path: qHexWalker*.AppImage
          if-no-files-found: error

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: qHexWalker*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
